services:
  web:
    image: ${COMPOSE_PROJECT_NAME}-web
    build: .
    ports:
      - "127.0.0.1:${PORT:-8088}:8080"
    environment:
      BUSINESS_EMAIL: ${BUSINESS_EMAIL:-}
      BUSINESS_PHONE: ${BUSINESS_PHONE:-}
      SERVICE_AREA: ${SERVICE_AREA:-}
      FACEBOOK_URL: ${FACEBOOK_URL:-}
      INSTAGRAM_URL: ${INSTAGRAM_URL:-}
      QUOTE_EMAIL_TO: ${QUOTE_EMAIL_TO:-}
      REQUEST_STORAGE: /var/lib/lion/requests
    volumes:
      - ./public:/var/www/html:ro
      - ./app:/var/www/app:ro
      - requests:/var/lib/lion/requests
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "php",
          "-r",
          "exit(@file_get_contents('http://localhost:8080/health.php') === 'ok' ? 0 : 1);",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
    security_opt:
      - no-new-privileges:true
  notifications:
    image: ${COMPOSE_PROJECT_NAME}-web
    pull_policy: never
    depends_on:
      - web
    command: ["sh", "-c", "while :; do php /var/www/app/notify-quotes.php; sleep 60; done"]
    environment:
      QUOTE_EMAIL_TO: ${QUOTE_EMAIL_TO:-}
      QUOTE_EMAIL_FROM: ${QUOTE_EMAIL_FROM:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      REQUEST_STORAGE: /var/lib/lion/requests
    volumes:
      - ./app:/var/www/app:ro
      - requests:/var/lib/lion/requests
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
volumes:
  requests:
