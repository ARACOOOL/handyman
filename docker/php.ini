expose_php = Off
display_errors = Off
log_errors = On
error_reporting = E_ALL
session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.upload_progress.enabled = 0
upload_max_filesize = 10M
post_max_size = 12M
; Parse one extra file so the app can reject submissions over its five-file limit.
max_file_uploads = 6
max_execution_time = 15
date.timezone = UTC
