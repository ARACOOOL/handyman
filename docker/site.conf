Listen 8080
<VirtualHost *:8080>
    DocumentRoot /var/www/html
    LimitRequestBody 12582912
    SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on
    <Directory /var/www/html>
        Options -Indexes
        AllowOverride None
        Require all granted
        DirectoryIndex index.php
    </Directory>
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set X-Frame-Options "DENY"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
    Header always set Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; font-src 'self'; script-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    <FilesMatch "\.(css|js|woff2|webp|jpg|png|svg)$">
        Header set Cache-Control "public, max-age=86400"
    </FilesMatch>
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
